[parameters]

# =========================================================
# Shape geometry
# =========================================================

#
# Registered structural geometry.
#
# Supported values:
#
#     circle
#     square
#     polygon
#

shape_geometry = "circle"


#
# Number of sides used when shape_geometry is "polygon".
#
# The minimum valid value is 3.
#
# The default of 8 produces a regular octagon.
#
# This value has no geometric effect for circle or square geometry.
#

shape_sides = 8


#
# Counterclockwise rotation of regular polygon geometry, in degrees.
#
# Zero places one polygon vertex on the positive Y axis.
#
# For a polygon with n sides, a rotation of 180 / n degrees places
# the center of one side on the positive Y axis.
#
# This value has no geometric effect for circle or square geometry.
#

shape_rotation = 0.0


# =========================================================
# Physical dimensions
# =========================================================

#
# Overall physical X/Y envelope of the Shape, in millimeters.
#
# For polygon geometry, the rotated polygon is uniformly normalized so
# that its greatest X/Y extent corresponds to this physical size.
#

shape_size = 100.0


#
# Physical thickness of the structural base, in millimeters.
#

shape_base_raise = 2.0

#
# Semantic printing color of the structural base.
#
# Color names are resolved through the shared color catalog.
#

shape_base_color = "white"


# =========================================================
# Outer ridge
# =========================================================

#
# Physical width of the optional outer ridge, measured inward
# from the complete Shape boundary, in millimeters.
#
# For polygon geometry, width is measured perpendicular to each
# polygon edge.
#
# Zero disables the ridge. Positive width enables the ridge.
#

shape_outer_ridge_width = 0.0


#
# Physical Z displacement of the outer-ridge top relative to
# the top of the base, in millimeters.
#
# Positive values place the ridge top above the base top.
# Zero places the ridge top flush with the base top.
# Negative values place the ridge top below the base top.
#
# The minimum valid value is -shape_base_raise.
#
# Ridge raise does not determine whether the ridge exists.
#

shape_outer_ridge_raise = 1.0


#
# Structural partitioning policy for an enabled outer ridge.
#
# Supported values:
#
#     integrated
#     separate
#
# This value has no geometric effect while the ridge is disabled.
#

shape_outer_ridge_style = "integrated"


# outer ridge defaults to shape_base_color unless
# it is overridden

## shape_outer_ridge_color = "black"


# =========================================================
# Inner ridge
# =========================================================

#
# Physical width of the optional inner ridge, measured inward
# from its positioned outer boundary, in millimeters.
#
# For polygon geometry, width is measured perpendicular to each
# polygon edge.
#
# Zero disables the ridge. Positive width enables the ridge.
#

shape_inner_ridge_width = 0.0


# Physical Z displacement of the inner-ridge top relative to
# the top of the base, in millimeters.
#
# Positive values place the ridge top above the base top.
# Zero places the ridge top flush with the base top.
#
# Negative values are invalid.
#
# Ridge raise does not determine whether the ridge exists.

shape_inner_ridge_raise = 1.0


#
# Physical distance between the inner ridge and its outer
# positioning reference, in millimeters.
#
# When the outer ridge participates, this distance is measured
# inward from the inside boundary of the outer ridge.
#
# When the outer ridge does not participate, this distance is
# measured inward from the complete Shape boundary.
#

shape_inner_to_outer_ridge_dist = 10.0


#
# Optional physical printing-color override for the inner ridge.
#
# When not explicitly configured, the inner ridge inherits the
# resolved physical printing color of the Shape base.
#
# This parameter affects physical color assignment during
# packaging only. It does not determine ridge participation
# or geometry.
#

## shape_inner_ridge_color = "white"


# =========================================================
# Border labels
# =========================================================

#
# Physical clear-border width surrounding the common Border Label
# lettering band, in millimeters.
#
# This distance is applied on both sides of the lettering band.
#
# Must be greater than or equal to zero.
#

shape_border_label_width = 1.0


#
# Maximum physical glyph-height allocation for participating
# Border Labels, in millimeters.
#
# Top and Bottom Border Labels share one resolved glyph height.
# The resolved height may be reduced as necessary so that all
# participating labels fit their available paths.
#
# Must be greater than zero when either Border Label participates.
#

shape_border_label_max_glyph_height = 5.0


#
# Maximum permitted perimeter span for each Border Label,
# in degrees.
#
# Must be greater than zero and less than 180 degrees.
#

shape_border_label_arc_degrees = 140.0


#
# Physical unused path length reserved at each end of the maximum
# permitted Border Label path, in millimeters.
#
# Must be greater than or equal to zero.
#

shape_border_label_end_margin = 1.0


#
# Font family used by both Border Labels.
#

shape_border_label_font_family = "Arial"


#
# Optional Top Border Label text.
#
# Empty or whitespace-only text disables the Top Border Label.
#

shape_top_border_label_text = ""


#
# Physical height of the Top Border Label above the top surface
# of the Shape base, in millimeters.
#

shape_top_border_label_raise = 1.0


#
# Optional physical printing-color override for the Top Border Label.
#
# When not explicitly configured, the Top Border Label inherits the
# resolved physical printing color of the Shape base.
#
# This parameter affects physical color assignment during packaging
# only. It does not determine Border Label participation or geometry.
#

## shape_top_border_label_color = "white"


#
# Optional Bottom Border Label text.
#
# Empty or whitespace-only text disables the Bottom Border Label.
#

shape_bottom_border_label_text = ""


#
# Physical height of the Bottom Border Label above the top surface
# of the Shape base, in millimeters.
#

shape_bottom_border_label_raise = 1.0


#
# Optional physical printing-color override for the Bottom Border Label.
#
# When not explicitly configured, the Bottom Border Label inherits the
# resolved physical printing color of the Shape base.
#
# This parameter affects physical color assignment during packaging
# only. It does not determine Border Label participation or geometry.
#

## shape_bottom_border_label_color = "white"


# =========================================================
# Incorporated Artwork
# =========================================================

#
# Physical height of incorporated Artwork above the top
# of the Shape base, in millimeters.
#
# This value belongs to Shape dimensionalization and is
# independent of standalone Artwork extrusion parameters.
#

shape_artwork_raise = 1.0

#
# Physical height of the optional Artwork fill above the top
# of the Shape base, in millimeters.
#
# Zero disables the fill. Positive values enable the fill.
#
# Fill participation and physical height are independent of
# physical color selection.
#

shape_artwork_fill_raise = 0.0

#
# Optional physical printing-color override for Artwork fill.
#
# When not explicitly configured, Artwork fill inherits the
# resolved physical printing color of the Shape base.
#
# This parameter affects physical color assignment during
# packaging only. It does not determine fill participation
# or geometry.
#

## shape_artwork_fill_color = "white"
