#
# Colors physically available in the local filament library.
#
# library_colors identifies the subset of catalog colors currently
# owned and available for installation on the printer. It is not the
# complete color catalog and does not describe colors currently
# installed on the printer.
#
# Every library color must reference an entry in the color catalog.
#

